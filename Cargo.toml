[workspace]
members = [
    "bulletproofs",
    "relations",
]

resolver = "2"

[patch.crates-io]
#dock_crypto_utils = { path = "../crypto/utils" }
dock_crypto_utils = { git = "https://github.com/PolymeshAssociation/crypto", branch = "dart-v0" }

## Polymesh changes.
#ark-serialize = { path = "../arkworks-algebra/serialize" }
#ark-ec = { path = "../arkworks-algebra/ec" }
#ark-ff = { path = "../arkworks-algebra/ff" }
#ark-pallas = { path = "../arkworks-algebra/curves/pallas" }
#ark-vesta = { path = "../arkworks-algebra/curves/vesta" }
#ark-secp256k1 = { path = "../arkworks-algebra/curves/secp256k1" }
#ark-secq256k1 = { path = "../arkworks-algebra/curves/secq256k1" }

ark-serialize = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "dart-v0" }
ark-ec = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "dart-v0" }
ark-ff = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "dart-v0" }
ark-pallas = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "dart-v0" }
ark-vesta = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "dart-v0" }
ark-secp256k1 = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "dart-v0" }
ark-secq256k1 = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "dart-v0" }

[workspace.dependencies]
dock_crypto_utils = { version = "0.22.0", default-features = false }
ark-ff = { version = "0.5.0", default-features = false }
ark-ec = { version = "0.5.0", default-features = false }
ark-serialize = { version = "0.5.0", default-features = false }
ark-std = { version = "0.5.0", default-features = false }
ark-pallas = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-vesta = { version = "0.5.0", default-features = false }
ark-secp256k1 = { version = "0.5.0", default-features = false }
ark-secq256k1 = { version = "0.5.0", default-features = false }

[profile.release]
opt-level = 3
lto = true

[profile.bench]
inherits = "release"
# https://doc.rust-lang.org/rustc/linker-plugin-lto.html
lto = "fat"

# Use this profile to compile binary for deployment
[profile.production]
inherits = "release"
# Keeping lto independent from bench for now
# https://doc.rust-lang.org/rustc/linker-plugin-lto.html
lto = "fat"
# https://doc.rust-lang.org/rustc/codegen-options/index.html#codegen-units
codegen-units = 1