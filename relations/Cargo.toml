[package]
name = "relations"
version = "0.1.0"
edition = "2021"

[dependencies]
sha3 = { version = "0.10.6", default-features = false }
rand = { version = "0.8", default-features = false }
rand_core = { version = "0.6", default-features = false }
log = { version = "0.4.27", default-features = false }
thiserror = { version = "2", default-features = false }
bulletproofs = { path = "../bulletproofs", default-features = false }
ark-ff = { version = "0.4", default-features = false }
ark-ec = { version = "0.4", default-features = false }
ark-serialize = { version = "0.4", default-features = false }
ark-std = { version = "0.4", default-features = false }
ark-crypto-primitives = { version = "0.4", default-features = false, features = ["signature"] }
digest = { version = "0.10.7", default-features = false }
blake2 = { version = "0.10", default-features = false }
rayon = { version = "1.5.3", optional = true, default-features = false }

dock_crypto_utils = { workspace = true, default-features = false }
schnorr_pok = { workspace = true, default-features = false }

[dev-dependencies]
test-log = "0.2"
criterion = "0.3"
ark-pallas = "0.4"
ark-vesta = "0.4"
ark-secp256k1 = "0.4"
ark-secq256k1 = "0.4"

[features]
default = ["std", "asm", "parallel"]

no_std = []
std = ["rand/std", "thiserror/std", "bulletproofs/std", "ark-serialize/std"]

asm = ["ark-ff/asm", "bulletproofs/asm"]
parallel = ["rayon", "ark-ec/parallel", "ark-ff/parallel", "ark-std/parallel", "bulletproofs/parallel", "dock_crypto_utils/parallel", "schnorr_pok/parallel"]
bench_prover = []
detailed_benchmarks = []
usenix = ["bench_prover"]
table1 = ["usenix"]
table2 = ["usenix"]
table3 = ["usenix"]
all-tables = ["table1", "table2", "table3"]

[[bench]]
name = "batched_select_rerandomize"
harness = false

[[bench]]
name = "select_rerandomize"
harness = false

[[bench]]
name = "coin"
harness = false

[[bench]]
name = "accumulator"
harness = false

# TODO: Uncomment
#[build]
# Adds architecture specific optimizations including those enabling the asm backend for ark_ff. It could potentially cause slowdowns from other features.
#rustflags = "-C target-cpu=native"
# You could alternatively add support for the asm backend through "-C target-feature=+bmi2,+adx", but the binary would only run on systems supporting these instructions.
