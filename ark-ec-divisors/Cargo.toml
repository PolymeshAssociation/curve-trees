[package]
name = "ark-ec-divisors"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-serialize = { workspace = true, default-features = false }
ark-ec = { workspace = true, default-features = false }
ark-ff = { workspace = true, default-features = false }
dock_crypto_utils = { workspace = true, default-features = false }
rayon = {version = "1.5.3", default-features = false, optional = true }
zeroize.workspace = true
rand_core = { version = "0.6", default-features = false }
rand = { version = "0.8", default-features = false, optional = true }
subtle = { version = "2", default-features = false }
ark-std = { version = "0.5.0", default-features = false }
ark-ed25519 = { version = "0.5.0", optional = true }
ark-curve25519 = { version = "0.5.0", optional = true }
ark-wei25519 = { workspace = true, optional = true }
crypto-bigint = { version = "0.5", default-features = false, features = ["zeroize"], optional = true }
ark-pallas = { workspace = true, optional = true }
ark-vesta = { workspace = true, optional = true }
ark-helios = { workspace = true, optional = true }
ark-selene = { workspace = true, optional = true }
spin = { version = "0.9", default-features = false, features = ["once", "rwlock"] }
generic-array = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
ark-pallas = { workspace = true }
ark-vesta = { workspace = true }
ark-helios = { workspace = true }
ark-selene = { workspace = true }
ark-wei25519 = { workspace = true }
ark-ed25519 = {workspace = true}
ark-curve25519 = {workspace = true}

[features]
default = [
    "std", "asm",
    "pallas", "vesta",
    "rand", "parallel"
]

no_std = []
std = [
    "ark-ec/std",
    "ark-ff/std",
    "ark-serialize/std",
    "ark-std/std",
    "dock_crypto_utils/std",
    "subtle/std",
    "thiserror/std",
    "ark-pallas?/std",
    "ark-vesta?/std",
    "ark-helios?/std",
    "ark-selene?/std",
    "ark-wei25519?/std"
]
asm = ["ark-ff/asm", "ark-pallas?/asm", "ark-vesta?/asm", "ark-helios?/asm", "ark-selene?/asm", "ark-wei25519?/asm"]
parallel = [
    "std",
    "rayon",
]
parallel_full = [
    "parallel",
    "ark-ff/parallel",
    "ark-ec/parallel",
    "dock_crypto_utils/parallel_full"
]
wei25519 = ["ark-wei25519", "ark-ed25519", "ark-curve25519"]
pallas = ["ark-pallas"]
vesta = ["ark-vesta"]
helios = ["ark-helios"]
selene = ["ark-selene"]
